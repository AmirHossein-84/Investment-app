<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#131B2A"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4A3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="cryptoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8247E5"/>
      <stop offset="50%" stop-color="#627EEA"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2A384C" stroke-width="6"/>

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="800 200" opacity="0.85" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cryptoGrad)" stroke-width="8" stroke-dasharray="500 150" opacity="0.9"/>

  <!-- Center Gold Ingot & Crypto Emblem -->
  <g transform="translate(156, 156)">
    <!-- Gold Ingot -->
    <path d="M 40,140 L 80,60 L 160,60 L 140,140 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 80,60 L 120,20 L 180,20 L 160,60 Z" fill="#FFF4A3" opacity="0.95" />
    <path d="M 160,60 L 180,20 L 180,90 L 140,140 Z" fill="#996515" opacity="0.85" />
    
    <!-- Crypto Chart & Sparkle overlay -->
    <path d="M 20,130 Q 70,110 100,70 T 170,30" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <polygon points="170,15 185,32 162,38" fill="#10B981"/>
    
    <circle cx="100" cy="70" r="7" fill="#627EEA" stroke="#FFF" stroke-width="2"/>
    <circle cx="170" cy="30" r="8" fill="#10B981" stroke="#FFF" stroke-width="2"/>
  </g>
</svg>
