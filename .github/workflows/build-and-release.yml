name: Multi-Platform Build & Preview Release (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'شماره نسخه دلخواه (مثال: v1.1 یا v1.2 - در صورت خالی بودن خودکار تعیین می‌شود)'
        required: false
        default: ''

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE20: true

jobs:
  # ========================================================
  # JOB 1: Build Android APK
  # ========================================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets (Vite PWA)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # ========================================================
  # JOB 2: Build iOS IPA (For Sideloadly / AltStore / SideStore)
  # ========================================================
  build-ios:
    name: 🍏 Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install

      - name: Build Xcode Archive & Package IPA
        run: |
          cd ios/App
          # Build unsigned xcarchive using CocoaPods xcworkspace
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Package Payload into unsigned .ipa file
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr Investment-App.ipa Payload
          cd ../../

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/build/Investment-App.ipa
          if-no-files-found: error

  # ========================================================
  # JOB 3: Create GitHub Draft/Preview Release with APK & IPA
  # ========================================================
  release:
    name: 📦 Publish Draft & Preview Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version & Tag
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-files

      - name: Rename Release Files
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          mv release-files/app-release.apk "release-files/Tarazino-${TAG}.apk"
          mv release-files/Investment-App.ipa "release-files/Tarazino-${TAG}.ipa"

      - name: Create Preview Draft Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "💎 ترازینو (Tarazino) ${{ steps.get_version.outputs.tag }} (Android APK & iOS IPA)"
          draft: true
          prerelease: true
          make_latest: false
          body: |
            <div dir="rtl">

            # 💎 اپلیکیشن ترازینو - مدیریت سرمایه‌گذاری (نسخه ${{ steps.get_version.outputs.tag }})


            ---

            ### 🚀 امکانات و قابلیت‌های اصلی (Key Features)

            - 🪙 **مدیریت هوشمند طلای فیزیکی و صندوق‌های بورسی**: رصد لحظه‌ای سکه، طلای ۱۸ و ۲۴ عیار، و صندوق‌های طلا (طلا، عیار، کهربا، زر و...)
            - ⚡ **اتصال آنی به نوبیتکس (Nobitex Ultra-Fast Sync)**: همگام‌سازی فوق‌سریع موجودی کیف‌پول‌ها، نرخ‌های لحظه‌ای و کش هوشمند میانگین قیمت خرید
            - 📈 **محاسبه دقیق سود و زیان (P&L)**: نمایش درصد و مبلغ سود/زیان کل و تک‌تک دارایی‌ها با رنگ‌بندی دقیق
            - ⚖️ **ماشین‌حساب تعادل سبد (Rebalancing Engine)**: پیشنهاد خودکار مقادیر خرید و فروش جهت حفظ نسبت طلایی ۸۰/۲۰ یا درصد دلخواه
            - 💵 **حالت نمایش دوگانه (تومان / دلار)**: تبدیل آنی کلیه دارایی‌ها به دلار ($) بر مبنای نرخ لحظه‌ای تتر
            - 🎨 **طراحی مدرن Soft Slate و Dark Mode**: رابط کاربری سریع با فیدبک لمسی (Haptic) و انیمیشن‌های روان

            ---

            ### 📥 فایل‌های دانلودی و راهنمای نصب (Installation Guide)

            | پلتفرم | نام فایل خروجی | راهنمای نصب سریع |
            | :--- | :--- | :--- |
            | **🤖 اندروید (Android APK)** | `Tarazino-${{ steps.get_version.outputs.tag }}.apk` | فایل APK را دانلود و مستقیماً روی گوشی نصب کنید. |
            | **🍏 آیفون (iOS IPA)** | `Tarazino-${{ steps.get_version.outputs.tag }}.ipa` | با استفاده از ابزارهای رایگان **Sideloadly** یا **AltStore** / **SideStore** نصب فرمایید. |
            | **🌐 نسخه تحت وب (PWA)** | بدون نیاز به دانلود | وب‌سایت **[investment-app-mu-five.vercel.app](https://investment-app-mu-five.vercel.app/)** را در سافاری باز کرده و **Add to Home Screen** را بزنید. |

            ---

            ### 💡 نحوه تایید و انتشار رسمی (Publishing Steps)
            1. فایل نصبی مورد نظر را از بخش **Assets** در پایین همین صفحه دانلود و عملکرد آن را بررسی کنید.
            2. در صورت نیاز به تغییر توضیحات یا تگ نسخه، دکمه **Edit** در گوشه بالا سمت راست صفحه Release را بزنید.
            3. در نهایت با انتخاب گزینه **Publish release**، نسخه را به صورت رسمی منتشر فرمایید.

            ---

            </div>
          files: |
            release-files/*.apk
            release-files/*.ipa
