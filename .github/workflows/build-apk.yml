name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Assets (Vite PWA)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug / Release)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Investment-App-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Investment-App-Android-APK
          path: release-apk/Investment-App-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "📱 اپلیکیشن مدیریت سبد طلا و کریپتو ${{ github.event.inputs.release_tag || github.ref_name }}"
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🌟 نسخه جدید اپلیکیشن مدیریت سبد سرمایه‌گذاری (فایل نصبی اندروید)

            ### ✨ ویژگی‌ها:
            - **تخصیص هوشمند سرمایه**: پس‌انداز ۳۰٪ و تقسیم ۸۰٪ طلا و ۲۰٪ ارزهای دیجیتال.
            - **بازتنظیم سبد (Portfolio Rebalancing)**: محاسبه خریدهای پیشنهادی بر اساس موجودی فعلی.
            - **کارکرد ۱۰۰٪ آفلاین**: بدون نیاز به اینترنت یا سرور، با ذخیره دائمی روی حافظه گوشی.
            - **طراحی لوکس فین‌تک**: فارسی، راست‌چین و بهینه‌سازی‌شده برای کاربری تک‌دست موبایل.

            ### 📲 نحوه نصب:
            فایل **`Investment-App-v1.0.0.apk`** را از بخش **Assets** در پایین همین صفحه دانلود کرده و روی گوشی اندروید خود نصب کنید.
          files: |
            release-apk/Investment-App-v1.0.0.apk
