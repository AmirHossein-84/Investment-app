name: Build & Auto Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Auto Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Assets (Vite PWA)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Investment-App-v1.0.${{ github.run_number }}.apk

      - name: Automatically Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "📱 نسخه آماده نصب ${{ github.run_number }} (v1.0.${{ github.run_number }})"
          draft: false
          prerelease: false
          body: |
            ## 🌟 نسخه نصبی اپلیکیشن مدیریت سبد سرمایه‌گذاری طلا و ارزهای دیجیتال

            این فایل APK به صورت خودکار توسط **GitHub Actions** کامپایل و آماده‌سازی شده است.

            ### ✨ قابلیت‌ها:
            - محاسبه هوشمند پس‌انداز ۳۰٪ و تفکیک ۸۰٪ طلا و ۲۰٪ رمزارزها
            - بازتنظیم سبد دارایی‌ها (Portfolio Rebalancing)
            - کارکرد ۱۰۰٪ آفلاین و بدون نیاز به اینترنت یا سرور

            ### 📲 دانلود مستقیم روی گوشی:
            روی فایل **`Investment-App-v1.0.${{ github.run_number }}.apk`** در بخش **Assets** در پایین کلیک کنید تا مستقیماً دانلود و نصب شود.
          files: |
            release-apk/*.apk
